name: jellyfin

services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    networks:
      - lab
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ../data/config:/config
      - ../data/cache:/cache
      - ../data/jellybridge:/jellybridge
      - /mnt/docker-data/media:/media:ro
    ports:
      - '8096:8096'
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.media.rule=Host(`media.thegarden`)
      - traefik.http.routers.media.entrypoints=websecure
      - traefik.http.routers.media.tls=true
      - traefik.http.services.media.loadbalancer.server.port=8096

networks:
  lab:
    external: true
