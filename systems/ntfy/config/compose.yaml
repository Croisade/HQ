name: ntfy

services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command:
      - serve
    environment:
      - TZ=America/New_York
      - NTFY_BASE_URL=https://ntfy.thegarden
    networks:
      - lab
    volumes:
      - ../data/cache:/var/cache/ntfy
      - ../data/etc:/etc/ntfy
    ports:
      - '38088:80'
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.ntfy.rule=Host(`ntfy.thegarden`)
      - traefik.http.routers.ntfy.entrypoints=websecure
      - traefik.http.routers.ntfy.tls=true
      - traefik.http.services.ntfy.loadbalancer.server.port=80

networks:
  lab:
    external: true
