name: actual-budget

services:
  actual-budget:
    image: docker.io/actualbudget/actual-server:latest
    container_name: actual-budget
    networks:
      - lab
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_EXTRA_CA_CERTS=/mkcert-rootCA.pem
    ports:
      - '5006:5006'
    volumes:
      - ../data:/data
      - ../../traefik/data/mkcert-ca/rootCA.pem:/mkcert-rootCA.pem:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.budget.rule=Host(`budget.thegarden`)
      - traefik.http.routers.budget.entrypoints=websecure
      - traefik.http.routers.budget.tls=true
      - traefik.http.services.budget.loadbalancer.server.port=5006

networks:
  lab:
    external: true
