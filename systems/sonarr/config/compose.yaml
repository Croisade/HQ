name: sonarr

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.11
    container_name: sonarr
    networks:
      - lab
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ../data:/config
      - /mnt/docker-data/media/tv:/tv
      - /mnt/docker-scratch/downloads:/downloads
    ports:
      - '38082:8989'
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.tv.rule=Host(`tv.thegarden`)
      - traefik.http.routers.tv.entrypoints=web
      - traefik.http.services.tv.loadbalancer.server.port=8989

networks:
  lab:
    external: true
