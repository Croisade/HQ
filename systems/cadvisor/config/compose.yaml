name: cadvisor

services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    command:
      - '--docker_only=true'
      # default disabled set + disk,diskIO — the disk-usage (`du`-style)
      # scan collectors were the source of cadvisor's own periodic CPU
      # bursts (3.5-15%+), and disk I/O metrics aren't needed here.
      - '--disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp,disk,diskIO'
    networks:
      - lab
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped

networks:
  lab:
    external: true
