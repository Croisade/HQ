name: matter-server

services:
  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    command: --storage-path /data --primary-interface enp3s0
    volumes:
      - ../data:/data
      - /run/dbus:/run/dbus:ro
